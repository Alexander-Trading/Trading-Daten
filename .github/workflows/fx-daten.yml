name: FX-Daten (Gold & EUR/USD)

on:
  schedule:
    - cron: "0 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fx-daten
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install --upgrade yfinance pandas

      - name: Daten holen und anhaengen
        run: |
          python - <<'PY'
          import os, json, time
          from datetime import datetime, timezone
          import pandas as pd
          import yfinance as yf

          TICKER = {
              "GOLD_FUT":   "GC=F",
              "GOLD_SPOT":  "XAUUSD=X",
              "EURUSD":     "EURUSD=X",
              "EURUSD_ALT": "EUR=X",
          }
          INTERVALS = {"1d": "max", "1h": "730d", "15m": "60d"}

          OUT = "data/fx"
          os.makedirs(OUT, exist_ok=True)
          manifest = {"aktualisiert": datetime.now(timezone.utc).isoformat(), "serien": {}}

          def flach(df):
              if isinstance(df.columns, pd.MultiIndex):
                  df.columns = [c[0] for c in df.columns]
              df.columns = [str(c).lower().replace(" ", "_") for c in df.columns]
              return df

          def hole(ticker, interval, period, versuche=3):
              for v in range(versuche):
                  try:
                      df = yf.download(ticker, period=period, interval=interval,
                                       auto_adjust=False, progress=False, threads=False)
                      if df is not None and len(df):
                          return flach(df)
                  except Exception as e:
                      print(f"  Versuch {v+1} fehlgeschlagen: {e}")
                  time.sleep(5 * (v + 1))
              return None

          for name, ticker in TICKER.items():
              for interval, period in INTERVALS.items():
                  pfad = f"{OUT}/{name}_{interval}.csv"
                  key = f"{name}_{interval}"
                  print(f"[{key}] lade {ticker} ...")

                  neu = hole(ticker, interval, period)
                  if neu is None:
                      print("  KEINE DATEN - ueberspringe")
                      manifest["serien"][key] = {"status": "fehlgeschlagen"}
                      continue

                  neu = neu.reset_index()
                  neu = neu.rename(columns={neu.columns[0]: "ts"})
                  neu["ts"] = pd.to_datetime(neu["ts"], utc=True, errors="coerce")
                  neu = neu.dropna(subset=["ts"])

                  spalten = [c for c in ["ts","open","high","low","close","adj_close","volume"]
                             if c in neu.columns]
                  neu = neu[spalten].dropna(subset=["close"])
                  neu = neu[neu["close"] > 0]

                  if os.path.exists(pfad):
                      alt = pd.read_csv(pfad)
                      alt["ts"] = pd.to_datetime(alt["ts"], utc=True, errors="coerce")
                      vorher = len(alt)
                      ges = pd.concat([alt, neu], ignore_index=True)
                  else:
                      vorher = 0
                      ges = neu

                  ges = (ges.drop_duplicates(subset="ts", keep="last")
                            .sort_values("ts").reset_index(drop=True))
                  ges.to_csv(pfad, index=False)
                  print(f"  {len(ges)} Bars (+{len(ges)-vorher})")

                  manifest["serien"][key] = {
                      "ticker": ticker, "interval": interval,
                      "bars": int(len(ges)), "neu": int(len(ges)-vorher),
                      "von": str(ges.ts.min()), "bis": str(ges.ts.max()),
                      "datei": pfad,
                  }
                  time.sleep(2)

          with open(f"{OUT}/FX_MANIFEST.json", "w") as f:
              json.dump(manifest, f, indent=2, ensure_ascii=False)
          print("Fertig.")
          PY

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fx
          if git diff --staged --quiet; then
            echo "Keine Aenderungen."
          else
            git commit -m "FX-Daten $(date -u +%Y-%m-%d)"
            git push
          fi
