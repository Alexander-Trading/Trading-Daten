# Dukascopy H1 Backfill mit Bid/Ask
#
# ZUSTAENDIGKEIT: Dieser Workflow laedt AUSSCHLIESSLICH Dukascopy-Instrumente
# nach data/fx. ETFs (data/etf) und Aktien (data/stocks) stammen aus
# aktien.yml bzw. marktdaten.yml und werden hier nicht angefasst.
#
# ACHTUNG - ZWEITER SCHREIBER AUF data/fx:
#   fx-daten.yml schreibt ebenfalls nach data/fx, laeuft per cron jeden
#   Werktag um 23 Uhr und holt Yahoo-Daten (kein Bid/Ask, andere Bars).
#   Solange beide laufen, ist der Inhalt von data/fx nicht eindeutig.
#   Empfehlung: in fx-daten.yml den Block "schedule:" auskommentieren,
#   dann laeuft er nur noch auf Knopfdruck.
#
# GEAENDERT 16.08.2026 - Grund: 28-31 % der bisherigen Bars waren Phantome.
#   Der Schalter -fl ("flats") liess dukascopy-node Bars ohne einen einzigen
#   Tick mitliefern, aufgefuellt mit dem letzten Kurs. Ergebnis: Samstagsbars
#   im Devisenmarkt, 94 % davon mit high == low, Volumen 0, Spread 12-fach.
#   Folgen: ATR um 24 % zu niedrig, und die Segmentierung an Datenluecken
#   konnte nicht mehr ausloesen, weil die Wochenenden zugeschuettet waren.
#
#   Drei Gegenmassnahmen: -fl entfernt, Eingabewert "neu_aufbauen" zum
#   Loeschen der Altdateien, und eine Phantom-Pruefung, die den Lauf
#   abbricht statt falsche Daten zu committen.
#
# ---------------------------------------------------------------------------
# UNIVERSUM FUER DEN TRENDFOLGE-TEST - Stand 17.08.2026
#
#   sauber, nichts zu tun:   eurusd  xauusd
#
#   Durchgang 1  (neu_aufbauen: JA - enthalten noch Phantome):
#       usdjpy usa500idxusd lightcmdusd
#   Durchgang 2  (neu_aufbauen: ja):
#       gbpusd usdchf usdcad
#   Durchgang 3  (neu_aufbauen: ja):
#       audusd xagusd brentcmdusd
#   Durchgang 4  (neu_aufbauen: ja):
#       usatechidxusd deuidxeur
#
#   "neu_aufbauen: ja" loescht NUR die Dateien der im selben Lauf genannten
#   Instrumente. Bereits saubere Instrumente bleiben unberuehrt, solange sie
#   nicht mit aufgefuehrt werden. eurusd und xauusd also NICHT eintragen.
#
# VERFUEGBARKEIT (H1, Stand 2026-08):
#   FX-Majors      ab 2003-05 bis 2003-08
#   xagusd         ab 2003-05
#   brentcmdusd    ab 2010-12
#   usa500idxusd   ab 2011-09
#   lightcmdusd    ab 2011-09
#   usatechidxusd  ab 2011-09
#   deuidxeur      ab 2013-09
# Frueher gibt es keine H1-Daten. Jahre davor laufen leer durch - kein Fehler.
# ---------------------------------------------------------------------------

name: Dukascopy Backfill (H1 ab 2003)

on:
  workflow_dispatch:
    inputs:
      von_jahr:
        description: "Startjahr"
        required: true
        default: "2003"
      bis_jahr:
        description: "Endjahr (einschliesslich)"
        required: true
        default: "2026"
      instrumente:
        description: "Instrumente, durch Leerzeichen getrennt (Dukascopy-Ticker)"
        required: true
        default: "usdjpy usa500idxusd lightcmdusd"
      neu_aufbauen:
        description: "Vorhandene data/fx-Dateien vorher LOESCHEN? (ja/nein)"
        required: true
        default: "ja"

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: |
          npm install -g dukascopy-node
          pip install pandas

      # Ohne diesen Schritt bleiben die Phantom-Zeitstempel fuer immer in den
      # Dateien: das Zusammenfuehren haengt an, es ersetzt nicht.
      - name: Alte Dateien loeschen (nur bei neu_aufbauen = ja)
        env:
          NEU:   ${{ github.event.inputs.neu_aufbauen }}
          INSTR: ${{ github.event.inputs.instrumente }}
        run: |
          if [ "$NEU" != "ja" ]; then
            echo "neu_aufbauen = $NEU -> vorhandene Dateien bleiben."
            exit 0
          fi
          for INST in $INSTR; do
            OBEN=$(echo "$INST" | tr '[:lower:]' '[:upper:]')
            if [ -f "data/fx/${OBEN}_h1.csv" ]; then
              echo "loesche data/fx/${OBEN}_h1.csv"
              rm -f "data/fx/${OBEN}_h1.csv"
            fi
          done
          # Cache mitloeschen, damit nichts aus dem Flats-Zeitalter uebrig bleibt
          rm -rf .dukascopy-cache roh
          echo "Cache und Rohdaten entfernt."

      - name: Herunterladen (quartalsweise)
        env:
          VON:   ${{ github.event.inputs.von_jahr }}
          BIS:   ${{ github.event.inputs.bis_jahr }}
          INSTR: ${{ github.event.inputs.instrumente }}
        run: |
          mkdir -p roh
          # Quartalsweise statt jahresweise: kleinere Anfragen werden von
          # Dukascopy deutlich seltener abgeschnitten.
          for INST in $INSTR; do
            for PT in bid ask; do
              for JAHR in $(seq $VON $BIS); do
                for Q in 1 2 3 4; do
                  case $Q in
                    1) VONM="01-01"; BISM="04-01"; BISJ=$JAHR ;;
                    2) VONM="04-01"; BISM="07-01"; BISJ=$JAHR ;;
                    3) VONM="07-01"; BISM="10-01"; BISJ=$JAHR ;;
                    4) VONM="10-01"; BISM="01-01"; BISJ=$((JAHR+1)) ;;
                  esac
                  ZIEL="roh/${INST}_${PT}_${JAHR}Q${Q}.csv"
                  # Vollstaendigkeit an der ZEILENZAHL pruefen, nicht an der Dateigroesse.
                  # OHNE Flats hat ein FX-Quartal rund 1560 Handelsstunden, Indizes
                  # und Rohstoffe rund 1400. Schwelle darum 700 statt frueher 900 -
                  # mit Flats waren es rund 2160, die alte Schwelle passt nicht mehr.
                  if [ -s "$ZIEL" ] && [ $(wc -l < "$ZIEL") -gt 700 ]; then
                    echo "vollstaendig: $ZIEL ($(wc -l < "$ZIEL") Zeilen)"; continue
                  fi
                  rm -f "$ZIEL"
                  echo ">>> $INST $PT ${JAHR}Q${Q}"
                  dukascopy-node \
                    -i "$INST" \
                    -from "${JAHR}-${VONM}" \
                    -to   "${BISJ}-${BISM}" \
                    -t h1 -p "$PT" -f csv -v \
                    -dir roh -fn "${INST}_${PT}_${JAHR}Q${Q}.csv" \
                    -r 8 -re -bs 5 -bp 2000 \
                    --silent || echo "FEHLGESCHLAGEN: $INST $PT ${JAHR}Q${Q}"
                  sleep 3
                done
              done
            done
          done

      - name: Unvollstaendige Quartale erneut versuchen
        env:
          VON:   ${{ github.event.inputs.von_jahr }}
          BIS:   ${{ github.event.inputs.bis_jahr }}
          INSTR: ${{ github.event.inputs.instrumente }}
        run: |
          # Bis zu drei Anlaeufe. Einzelne Quartale fallen bei Dukascopy
          # zufaellig aus; ein einziger Nachholdurchgang reicht nicht.
          for VERSUCH in 1 2 3; do
          echo "=== Nachholdurchgang $VERSUCH ==="
          NACHZUHOLEN=""
          for INST in $INSTR; do
            for PT in bid ask; do
              for JAHR in $(seq $VON $BIS); do
                for Q in 1 2 3 4; do
                  ZIEL="roh/${INST}_${PT}_${JAHR}Q${Q}.csv"
                  if [ "$PT" = "bid" ]; then GEGEN="roh/${INST}_ask_${JAHR}Q${Q}.csv"; else GEGEN="roh/${INST}_bid_${JAHR}Q${Q}.csv"; fi
                  if [ ! -s "$ZIEL" ] || [ $(wc -l < "$ZIEL") -lt 700 ] || [ ! -s "$GEGEN" ] || [ $(wc -l < "$GEGEN") -lt 700 ]; then
                    NACHZUHOLEN="$NACHZUHOLEN ${INST}:${PT}:${JAHR}:${Q}"
                  fi
                done
              done
            done
          done
          if [ -z "$NACHZUHOLEN" ]; then echo "Alles vollstaendig."; break; fi
          ANZ=$(echo $NACHZUHOLEN | wc -w)
          echo "Nachzuholen: $ANZ Quartale"
          for E in $NACHZUHOLEN; do
            INST=$(echo $E | cut -d: -f1); PT=$(echo $E | cut -d: -f2)
            JAHR=$(echo $E | cut -d: -f3); Q=$(echo $E | cut -d: -f4)
            case $Q in
              1) VONM="01-01"; BISM="04-01"; BISJ=$JAHR ;;
              2) VONM="04-01"; BISM="07-01"; BISJ=$JAHR ;;
              3) VONM="07-01"; BISM="10-01"; BISJ=$JAHR ;;
              4) VONM="10-01"; BISM="01-01"; BISJ=$((JAHR+1)) ;;
            esac
            echo ">>> ZWEITER VERSUCH: $INST $PT ${JAHR}Q${Q}"
            rm -f "roh/${INST}_${PT}_${JAHR}Q${Q}.csv"
            dukascopy-node \
              -i "$INST" -from "${JAHR}-${VONM}" -to "${BISJ}-${BISM}" \
              -t h1 -p "$PT" -f csv -v \
              -dir roh -fn "${INST}_${PT}_${JAHR}Q${Q}.csv" \
              -r 12 -re -bs 3 -bp 5000 \
              --silent || echo "ERNEUT FEHLGESCHLAGEN: $INST $PT ${JAHR}Q${Q}"
            sleep 10
          done
          done

      - name: Rohdaten sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dukascopy-roh
          path: roh/
          retention-days: 7

      - name: Zusammenfuehren
        run: |
          python - <<'PY'
          import glob, os, re
          import pandas as pd

          os.makedirs("data/fx", exist_ok=True)
          uebersprungen = []

          def lade(pfad):
              if os.path.getsize(pfad) < 1000:
                  uebersprungen.append((pfad, "leer/zu klein")); return None
              try:
                  df = pd.read_csv(pfad)
              except (pd.errors.EmptyDataError, pd.errors.ParserError) as e:
                  uebersprungen.append((pfad, type(e).__name__)); return None
              if df.empty or len(df.columns) < 5:
                  uebersprungen.append((pfad, "keine Bars")); return None
              df.columns = [c.strip().lower() for c in df.columns]
              ts = df.columns[0]
              try:
                  df["ts"] = pd.to_datetime(df[ts].astype("int64"), unit="ms", utc=True)
              except (ValueError, TypeError):
                  df["ts"] = pd.to_datetime(df[ts], utc=True, errors="coerce")
              df = df.dropna(subset=["ts"])
              if df.empty:
                  uebersprungen.append((pfad, "keine gueltigen Zeitstempel")); return None
              return df

          instrumente = sorted({m.group(1) for p in glob.glob("roh/*.csv")
                                if (m := re.match(r"([a-z0-9]+)_(?:bid|ask)_\d{4}Q\d", os.path.basename(p)))})
          print(f"Instrumente gefunden: {instrumente}")

          geschrieben = 0
          schwere_luecken = []
          phantom_alarm = []
          for inst in instrumente:
              teile = {}
              for pt in ("bid", "ask"):
                  frames = [d for f in sorted(glob.glob(f"roh/{inst}_{pt}_*Q*.csv"))
                            if (d := lade(f)) is not None]
                  if not frames:
                      continue
                  df = pd.concat(frames, ignore_index=True)
                  spalten = [c for c in ["open","high","low","close","volume"] if c in df.columns]
                  df = df[["ts"] + spalten].rename(columns={c: f"{pt}_{c}" for c in spalten})
                  teile[pt] = df.drop_duplicates("ts", keep="last")

              if not teile:
                  print(f"{inst}: KEINE brauchbaren Daten"); continue

              ges = list(teile.values())[0]
              for df in list(teile.values())[1:]:
                  ges = ges.merge(df, on="ts", how="outer")
              ges = ges.sort_values("ts").reset_index(drop=True)

              # ---- PHANTOM-FILTER -------------------------------------------
              # Zweiter Riegel neben dem entfernten -fl. Bars ohne einen
              # einzigen Tick haben Volumen 0 und sind keine Marktdaten.
              vor = len(ges)
              volsp = [c for c in ("bid_volume", "al_volume", "ask_volume") if c in ges]
              if volsp:
                  maske = pd.Series(True, index=ges.index)
                  for c in volsp:
                      maske &= ges[c].fillna(0) > 0
                  ges = ges[maske].reset_index(drop=True)
              entfernt = vor - len(ges)
              if vor:
                  print(f"{inst}: Phantom-Filter entfernte {entfernt} von {vor} Bars "
                        f"({entfernt/vor*100:.1f} %)")
              # ---------------------------------------------------------------

              if "bid_close" in ges and "ask_close" in ges:
                  for feld in ("open","high","low","close"):
                      if f"bid_{feld}" in ges and f"ask_{feld}" in ges:
                          ges[feld] = (ges[f"bid_{feld}"] + ges[f"ask_{feld}"]) / 2
                  ges["spread"] = ges["ask_close"] - ges["bid_close"]

              kurs = "close" if "close" in ges else ("bid_close" if "bid_close" in ges else "ask_close")
              ges = ges[ges[kurs].notna() & (ges[kurs] > 0)]
              if ges.empty:
                  print(f"{inst}: nach Filterung leer"); continue

              pfad = f"data/fx/{inst.upper()}_h1.csv"
              if os.path.exists(pfad):
                  alt = pd.read_csv(pfad)
                  alt["ts"] = pd.to_datetime(alt["ts"], utc=True, errors="coerce")
                  # Auch die Altdatei durch den Phantom-Filter schicken, sonst
                  # ueberleben alte Flats-Zeitstempel jeden Neulauf.
                  for c in ("bid_volume", "ask_volume"):
                      if c in alt:
                          alt = alt[alt[c].fillna(0) > 0]
                  ges = (pd.concat([alt, ges], ignore_index=True)
                           .drop_duplicates("ts", keep="last")
                           .sort_values("ts").reset_index(drop=True))

              ges.to_csv(pfad, index=False)
              geschrieben += 1

              # ABDECKUNGSBERICHT
              proJahr = ges.ts.dt.year.value_counts().sort_index()
              print(f"\n=== {pfad}: {len(ges)} Bars | {ges.ts.min()} bis {ges.ts.max()} ===")

              # Phantom-Kontrolle: Samstagsbars und Nullspannen
              wtag = ges.ts.dt.dayofweek
              samstag = int((wtag == 5).sum())
              spanne0 = 0
              if "bid_high" in ges and "bid_low" in ges:
                  spanne0 = int((ges.bid_high == ges.bid_low).sum())
              print(f"   Samstagsbars: {samstag} | Nullspannen: {spanne0} "
                    f"({spanne0/len(ges)*100:.2f} %)")
              if samstag > len(ges) * 0.01 or spanne0 > len(ges) * 0.01:
                  phantom_alarm.append((inst, samstag, spanne0))

              luecken = []
              for jahr in range(int(proJahr.index.min()), int(proJahr.index.max())+1):
                  n = int(proJahr.get(jahr, 0))
                  marke = ""
                  # OHNE Flats: FX rund 6200 Bars/Jahr, Indizes und Rohstoffe weniger.
                  # Schwellen entsprechend gesenkt (frueher 3000 bzw. 1500).
                  schwelle = 5000 if ("idx" not in inst and "cmd" not in inst) else 3000
                  if n < schwelle:
                      marke = "   <-- LUECKE!"
                      luecken.append(jahr)
                  print(f"   {jahr}: {n:5d} Bars{marke}")
              if luecken:
                  print(f"   !!! UNVOLLSTAENDIGE JAHRE: {luecken}")
                  schwere_luecken.append((inst, luecken))
              else:
                  print(f"   Alle Jahre vollstaendig.")

          if uebersprungen:
              print(f"\n{len(uebersprungen)} Datei(en) uebersprungen:")
              for p, grund in uebersprungen[:40]:
                  print(f"  {p} -> {grund}")

          if geschrieben == 0:
              raise SystemExit("Keine einzige Datei geschrieben - Download pruefen!")

          if schwere_luecken:
              print("\n" + "="*60)
              print("WARNUNG: Diese Instrumente sind UNVOLLSTAENDIG:")
              for inst, fehlend in schwere_luecken:
                  print(f"  {inst}: {fehlend}")
              print("Workflow erneut starten - vorhandene Quartale werden uebersprungen.")
              print("="*60)

          # Harter Abbruch: lieber kein Commit als wieder Phantom-Daten.
          if phantom_alarm:
              print("\n" + "="*60)
              for inst, sa, s0 in phantom_alarm:
                  print(f"  {inst}: {sa} Samstagsbars, {s0} Nullspannen")
              print("="*60)
              raise SystemExit("PHANTOM-BARS GEFUNDEN - nicht committen. "
                               "Steht -fl noch im Download-Schritt? "
                               "Oder lief der Lauf ohne neu_aufbauen = ja?")
          PY

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -A statt add, damit auch geloeschte Dateien uebernommen werden
          git add -A data/fx
          if git diff --staged --quiet; then
            echo "Keine Aenderungen."
          else
            git commit -m "Dukascopy H1 Backfill ohne Flats (Phantom-Bars entfernt)"
            git push
          fi
