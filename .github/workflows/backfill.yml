name: Dukascopy Backfill (H1 ab 2003)

on:
  workflow_dispatch:
    inputs:
      von_jahr:
        description: "Startjahr (EURUSD ab 2003, XAUUSD ab 2003)"
        required: true
        default: "2003"
      bis_jahr:
        description: "Endjahr (einschliesslich)"
        required: true
        default: "2026"
      instrumente:
        description: "Instrumente, durch Leerzeichen getrennt"
        required: true
        default: "eurusd xauusd"

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: |
          npm install -g dukascopy-node
          pip install pandas

      - name: Herunterladen
        env:
          VON:   ${{ github.event.inputs.von_jahr }}
          BIS:   ${{ github.event.inputs.bis_jahr }}
          INSTR: ${{ github.event.inputs.instrumente }}
        run: |
          mkdir -p roh
          for INST in $INSTR; do
            for PT in bid ask; do
              for JAHR in $(seq $VON $BIS); do
                ZIEL="roh/${INST}_${PT}_${JAHR}.csv"
                if [ -f "$ZIEL" ]; then continue; fi
                echo ">>> $INST $PT $JAHR"
                dukascopy-node \
                  -i "$INST" \
                  -from "${JAHR}-01-01" \
                  -to   "$([ "$JAHR" = "$BIS" ] && echo now || echo $((JAHR+1))-01-01)" \
                  -t h1 -p "$PT" -f csv -v -fl \
                  -dir roh -fn "${INST}_${PT}_${JAHR}.csv" \
                  -r 5 -re -bs 10 -bp 800 --cache \
                  --silent || echo "FEHLGESCHLAGEN: $INST $PT $JAHR (weiter)"
                sleep 2
              done
            done
          done
          echo "=== Heruntergeladen ==="
          ls -la roh/ | head -60

      - name: Rohdaten sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dukascopy-roh
          path: roh/
          retention-days: 7

      - name: Zusammenfuehren
        run: |
          python - <<'PY'
          import glob, os, re
          import pandas as pd

          os.makedirs("data/fx", exist_ok=True)
          uebersprungen = []

          def lade(pfad):
              if os.path.getsize(pfad) < 20:
                  uebersprungen.append((pfad, "leer")); return None
              try:
                  df = pd.read_csv(pfad)
              except (pd.errors.EmptyDataError, pd.errors.ParserError) as e:
                  uebersprungen.append((pfad, type(e).__name__)); return None
              if df.empty or len(df.columns) < 5:
                  uebersprungen.append((pfad, "keine Bars")); return None
              df.columns = [c.strip().lower() for c in df.columns]
              ts = df.columns[0]
              try:
                  df["ts"] = pd.to_datetime(df[ts].astype("int64"), unit="ms", utc=True)
              except (ValueError, TypeError):
                  df["ts"] = pd.to_datetime(df[ts], utc=True, errors="coerce")
              df = df.dropna(subset=["ts"])
              if df.empty:
                  uebersprungen.append((pfad, "keine gueltigen Zeitstempel")); return None
              return df

          instrumente = sorted({m.group(1) for p in glob.glob("roh/*.csv")
                                if (m := re.match(r"([a-z]+)_", os.path.basename(p)))})
          print(f"Instrumente gefunden: {instrumente}")

          geschrieben = 0
          for inst in instrumente:
              teile = {}
              for pt in ("bid", "ask"):
                  frames = [d for f in sorted(glob.glob(f"roh/{inst}_{pt}_*.csv"))
                            if (d := lade(f)) is not None]
                  if not frames:
                      continue
                  df = pd.concat(frames, ignore_index=True)
                  spalten = [c for c in ["open","high","low","close","volume"] if c in df.columns]
                  df = df[["ts"] + spalten].rename(columns={c: f"{pt}_{c}" for c in spalten})
                  teile[pt] = df.drop_duplicates("ts", keep="last")

              if not teile:
                  print(f"{inst}: KEINE brauchbaren Daten"); continue

              ges = list(teile.values())[0]
              for df in list(teile.values())[1:]:
                  ges = ges.merge(df, on="ts", how="outer")
              ges = ges.sort_values("ts").reset_index(drop=True)

              if "bid_close" in ges and "ask_close" in ges:
                  for feld in ("open","high","low","close"):
                      if f"bid_{feld}" in ges and f"ask_{feld}" in ges:
                          ges[feld] = (ges[f"bid_{feld}"] + ges[f"ask_{feld}"]) / 2
                  ges["spread"] = ges["ask_close"] - ges["bid_close"]

              kurs = "close" if "close" in ges else ("bid_close" if "bid_close" in ges else "ask_close")
              ges = ges[ges[kurs].notna() & (ges[kurs] > 0)]
              if ges.empty:
                  print(f"{inst}: nach Filterung leer"); continue

              pfad = f"data/fx/{inst.upper()}_h1.csv"
              if os.path.exists(pfad):
                  alt = pd.read_csv(pfad)
                  alt["ts"] = pd.to_datetime(alt["ts"], utc=True, errors="coerce")
                  ges = (pd.concat([alt, ges], ignore_index=True)
                           .drop_duplicates("ts", keep="last")
                           .sort_values("ts").reset_index(drop=True))

              ges.to_csv(pfad, index=False)
              geschrieben += 1
              msg = f"{pfad}: {len(ges)} Bars | {ges.ts.min()} bis {ges.ts.max()}"
              if "spread" in ges:
                  msg += f" | mittlerer Spread {ges['spread'].mean():.5f}"
              print(msg)

          if uebersprungen:
              print(f"\n{len(uebersprungen)} Datei(en) uebersprungen (normal fuer Jahre ohne Daten):")
              for p, grund in uebersprungen[:20]:
                  print(f"  {p} -> {grund}")

          if geschrieben == 0:
              raise SystemExit("Keine einzige Datei geschrieben - Download pruefen!")
          PY

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fx
          if git diff --staged --quiet; then
            echo "Keine Aenderungen."
          else
            git commit -m "Dukascopy H1 Backfill"
            git push
          fi

