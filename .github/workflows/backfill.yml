# Dukascopy H1 Backfill mit Bid/Ask
#
# EMPFOHLENER ABLAUF - in Durchgaengen starten, nicht alles auf einmal.
# Ein Job hat maximal 350 Minuten; ein Instrument ueber 23 Jahre braucht
# grob 20-40 Minuten. Bereits vorhandene Dateien werden uebersprungen,
# ein erneuter Lauf ist also gefahrlos.
#
#   Durchgang 1  (Kerntest, drei Anlageklassen):
#       von 2003  bis 2026  ->  usdjpy usa500idxusd lightcmdusd
#
#   Durchgang 2  (weitere FX-Majors, volle Historie ab 2003):
#       von 2003  bis 2026  ->  gbpusd usdchf usdcad
#
#   Durchgang 3  (Rohstoffwaehrung und Silber als Konsistenzpruefung):
#       von 2003  bis 2026  ->  audusd xagusd
#
# VERFUEGBARKEIT (H1, Stand 2026-08):
#   FX-Majors      ab 2003-05 bis 2003-08
#   xagusd         ab 2003-05
#   brentcmdusd    ab 2010-12
#   usa500idxusd   ab 2011-09
#   lightcmdusd    ab 2011-09
#   usatechidxusd  ab 2011-09
#   deuidxeur      ab 2013-09
# Frueher gibt es keine H1-Daten. Jahre davor laufen leer durch - kein Fehler.

name: Dukascopy Backfill (H1 ab 2003)

on:
  workflow_dispatch:
    inputs:
      von_jahr:
        description: "Startjahr"
        required: true
        default: "2003"
      bis_jahr:
        description: "Endjahr (einschliesslich)"
        required: true
        default: "2026"
      instrumente:
        description: "Instrumente, durch Leerzeichen getrennt (Dukascopy-Ticker)"
        required: true
        default: "usdjpy usa500idxusd lightcmdusd"

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: |
          npm install -g dukascopy-node
          pip install pandas

      - name: Herunterladen (Durchgang 1)
        env:
          VON:   ${{ github.event.inputs.von_jahr }}
          BIS:   ${{ github.event.inputs.bis_jahr }}
          INSTR: ${{ github.event.inputs.instrumente }}
        run: |
          mkdir -p roh
          for INST in $INSTR; do
            for PT in bid ask; do
              for JAHR in $(seq $VON $BIS); do
                ZIEL="roh/${INST}_${PT}_${JAHR}.csv"
                # WICHTIG: nur ueberspringen wenn die Datei auch INHALT hat
                if [ -s "$ZIEL" ] && [ $(wc -c < "$ZIEL") -gt 1000 ]; then
                  echo "vorhanden: $ZIEL"; continue
                fi
                rm -f "$ZIEL"
                echo ">>> $INST $PT $JAHR"
                dukascopy-node \
                  -i "$INST" \
                  -from "${JAHR}-01-01" \
                  -to   "$([ "$JAHR" = "$BIS" ] && echo now || echo $((JAHR+1))-01-01)" \
                  -t h1 -p "$PT" -f csv -v -fl \
                  -dir roh -fn "${INST}_${PT}_${JAHR}.csv" \
                  -r 8 -re -bs 5 -bp 2000 --cache \
                  --silent || echo "FEHLGESCHLAGEN: $INST $PT $JAHR"
                sleep 5
              done
            done
          done

      - name: Fehlende Jahre erneut versuchen (Durchgang 2)
        env:
          VON:   ${{ github.event.inputs.von_jahr }}
          BIS:   ${{ github.event.inputs.bis_jahr }}
          INSTR: ${{ github.event.inputs.instrumente }}
        run: |
          echo "=== Suche nach leeren Dateien ==="
          NACHZUHOLEN=""
          for INST in $INSTR; do
            for PT in bid ask; do
              for JAHR in $(seq $VON $BIS); do
                ZIEL="roh/${INST}_${PT}_${JAHR}.csv"
                if [ ! -s "$ZIEL" ] || [ $(wc -c < "$ZIEL") -lt 1000 ]; then
                  NACHZUHOLEN="$NACHZUHOLEN ${INST}:${PT}:${JAHR}"
                fi
              done
            done
          done
          if [ -z "$NACHZUHOLEN" ]; then echo "Nichts nachzuholen."; exit 0; fi
          echo "Nachzuholen:$NACHZUHOLEN"
          for EINTRAG in $NACHZUHOLEN; do
            INST=$(echo $EINTRAG | cut -d: -f1)
            PT=$(echo $EINTRAG | cut -d: -f2)
            JAHR=$(echo $EINTRAG | cut -d: -f3)
            echo ">>> ZWEITER VERSUCH: $INST $PT $JAHR"
            rm -f "roh/${INST}_${PT}_${JAHR}.csv"
            # kleinere Haeppchen, laengere Pausen
            dukascopy-node \
              -i "$INST" \
              -from "${JAHR}-01-01" \
              -to   "$([ "$JAHR" = "${{ github.event.inputs.bis_jahr }}" ] && echo now || echo $((JAHR+1))-01-01)" \
              -t h1 -p "$PT" -f csv -v -fl \
              -dir roh -fn "${INST}_${PT}_${JAHR}.csv" \
              -r 10 -re -bs 3 -bp 4000 \
              --silent || echo "ERNEUT FEHLGESCHLAGEN: $INST $PT $JAHR"
            sleep 15
          done

      - name: Rohdaten sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dukascopy-roh
          path: roh/
          retention-days: 7

      - name: Zusammenfuehren
        run: |
          python - <<'PY'
          import glob, os, re
          import pandas as pd

          os.makedirs("data/fx", exist_ok=True)
          uebersprungen = []

          def lade(pfad):
              if os.path.getsize(pfad) < 1000:
                  uebersprungen.append((pfad, "leer/zu klein")); return None
              try:
                  df = pd.read_csv(pfad)
              except (pd.errors.EmptyDataError, pd.errors.ParserError) as e:
                  uebersprungen.append((pfad, type(e).__name__)); return None
              if df.empty or len(df.columns) < 5:
                  uebersprungen.append((pfad, "keine Bars")); return None
              df.columns = [c.strip().lower() for c in df.columns]
              ts = df.columns[0]
              try:
                  df["ts"] = pd.to_datetime(df[ts].astype("int64"), unit="ms", utc=True)
              except (ValueError, TypeError):
                  df["ts"] = pd.to_datetime(df[ts], utc=True, errors="coerce")
              df = df.dropna(subset=["ts"])
              if df.empty:
                  uebersprungen.append((pfad, "keine gueltigen Zeitstempel")); return None
              return df

          instrumente = sorted({m.group(1) for p in glob.glob("roh/*.csv")
                                if (m := re.match(r"([a-z0-9]+)_(?:bid|ask)_", os.path.basename(p)))})
          print(f"Instrumente gefunden: {instrumente}")

          geschrieben = 0
          for inst in instrumente:
              teile = {}
              for pt in ("bid", "ask"):
                  frames = [d for f in sorted(glob.glob(f"roh/{inst}_{pt}_*.csv"))
                            if (d := lade(f)) is not None]
                  if not frames:
                      continue
                  df = pd.concat(frames, ignore_index=True)
                  spalten = [c for c in ["open","high","low","close","volume"] if c in df.columns]
                  df = df[["ts"] + spalten].rename(columns={c: f"{pt}_{c}" for c in spalten})
                  teile[pt] = df.drop_duplicates("ts", keep="last")

              if not teile:
                  print(f"{inst}: KEINE brauchbaren Daten"); continue

              ges = list(teile.values())[0]
              for df in list(teile.values())[1:]:
                  ges = ges.merge(df, on="ts", how="outer")
              ges = ges.sort_values("ts").reset_index(drop=True)

              if "bid_close" in ges and "ask_close" in ges:
                  for feld in ("open","high","low","close"):
                      if f"bid_{feld}" in ges and f"ask_{feld}" in ges:
                          ges[feld] = (ges[f"bid_{feld}"] + ges[f"ask_{feld}"]) / 2
                  ges["spread"] = ges["ask_close"] - ges["bid_close"]

              kurs = "close" if "close" in ges else ("bid_close" if "bid_close" in ges else "ask_close")
              ges = ges[ges[kurs].notna() & (ges[kurs] > 0)]
              if ges.empty:
                  print(f"{inst}: nach Filterung leer"); continue

              pfad = f"data/fx/{inst.upper()}_h1.csv"
              if os.path.exists(pfad):
                  alt = pd.read_csv(pfad)
                  alt["ts"] = pd.to_datetime(alt["ts"], utc=True, errors="coerce")
                  ges = (pd.concat([alt, ges], ignore_index=True)
                           .drop_duplicates("ts", keep="last")
                           .sort_values("ts").reset_index(drop=True))

              ges.to_csv(pfad, index=False)
              geschrieben += 1

              # ABDECKUNGSBERICHT - das Entscheidende
              proJahr = ges.ts.dt.year.value_counts().sort_index()
              print(f"\n=== {pfad}: {len(ges)} Bars | {ges.ts.min()} bis {ges.ts.max()} ===")
              luecken = []
              for jahr in range(int(proJahr.index.min()), int(proJahr.index.max())+1):
                  n = int(proJahr.get(jahr, 0))
                  marke = ""
                  # Indizes und Rohstoffe handeln weniger Stunden als FX
                  schwelle = 3000 if ("idx" not in inst and "cmd" not in inst) else 1500
                  if n < schwelle:
                      marke = "   <-- LUECKE!"
                      luecken.append(jahr)
                  print(f"   {jahr}: {n:5d} Bars{marke}")
              if luecken:
                  print(f"   !!! UNVOLLSTAENDIGE JAHRE: {luecken}")
              else:
                  print(f"   Alle Jahre vollstaendig.")

          if uebersprungen:
              print(f"\n{len(uebersprungen)} Datei(en) uebersprungen:")
              for p, grund in uebersprungen[:40]:
                  print(f"  {p} -> {grund}")

          if geschrieben == 0:
              raise SystemExit("Keine einzige Datei geschrieben - Download pruefen!")
          PY

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fx
          if git diff --staged --quiet; then
            echo "Keine Aenderungen."
          else
            git commit -m "Dukascopy H1 Backfill (mit Nachhol-Durchgang)"
            git push
          fi
