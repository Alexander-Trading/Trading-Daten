name: Marktdaten

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas requests

      - name: Daten holen
        run: |
          python - <<'PY'
          import os, json, time
          from datetime import datetime, timezone
          import pandas as pd, yfinance as yf

          ETFS = ["SPY","QQQ","EWG","EFA","EEM","IWM","EWJ","FEZ",
                  "TLT","IEF","SHY","LQD","HYG","TIP","BND","EMB",
                  "GLD","SLV","USO","DBA","DBC","DBB",
                  "VNQ","RWX","UUP","FXE","FXY","FXB","FXA",
                  "XLK","XLF","XLE","XLV","XLI","XLP","XLY","XLU","XLB",
                  "PFF","JNK","BKLN","MUB","VYM","SDY","DVY","SCHD"]

          os.makedirs("data/etf", exist_ok=True)
          man = {"aktualisiert": datetime.now(timezone.utc).isoformat(), "etf": {}}

          for t in ETFS:
              try:
                  tk = yf.Ticker(t)
                  d = tk.history(start="1995-01-01", interval="1d", auto_adjust=True)
                  if d is None or len(d) < 300:
                      print("skip", t); continue
                  raw = tk.history(start="1995-01-01", interval="1d", auto_adjust=False)

                  ix = d.index.tz_localize(None) if d.index.tz else d.index
                  div = raw["Dividends"].reindex(d.index).fillna(0.0) if "Dividends" in raw.columns else pd.Series(0.0, index=d.index)
                  unadj = raw["Close"].reindex(d.index) if "Close" in raw.columns else d["Close"]

                  o = pd.DataFrame({
                      "date": ix,
                      "open": d["Open"].values,
                      "high": d["High"].values,
                      "low": d["Low"].values,
                      "close": d["Close"].values,
                      "volume": d["Volume"].values,
                      "dividend": div.values,
                      "unadj_close": unadj.values,
                  })
                  o.to_csv(f"data/etf/{t}.csv", index=False)
                  man["etf"][t] = {"n": len(o),
                                   "von": str(o.date.iloc[0].date()),
                                   "bis": str(o.date.iloc[-1].date()),
                                   "div_summe": float(o.dividend.sum())}
                  print(t, len(o), "div:", round(float(o.dividend.sum()), 2))
              except Exception as e:
                  print("FEHLER", t, e)
              time.sleep(0.5)

          os.makedirs("data", exist_ok=True)
          json.dump(man, open("data/MANIFEST.json", "w"), indent=2)
          print("fertig:", len(man["etf"]), "ETFs")
          PY

      - name: Committen
        run: |
          git config user.name datafeed-bot
          git config user.email actions@github.com
          git add data/
          git diff --staged --quiet || git commit -m "Daten $(date -u +%F)"
          git pull --rebase --autostash
          git push
