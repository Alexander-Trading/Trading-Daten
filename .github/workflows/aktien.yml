name: Aktien

on:
  schedule:
    - cron: "30 23 * * 6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aktien:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas requests

      - name: Aktien laden
        run: |
          python - <<'PY'
          import os, json, time, io
          import pandas as pd, requests, yfinance as yf

          url = ("https://raw.githubusercontent.com/hanshof/sp500_constituents/"
                 "main/sp_500_historical_components.csv")
          hist = pd.read_csv(io.StringIO(requests.get(url, timeout=60).text),
                             parse_dates=["date"])
          os.makedirs("data", exist_ok=True)
          hist.to_csv("data/sp500_members.csv", index=False)

          h = hist[hist.date >= "2005-01-01"]
          tick = set()
          for t in h.tickers:
              tick |= set(str(t).split(","))
          tick = sorted(t for t in tick if t.isalpha() and 1 <= len(t) <= 5)
          print(len(tick), "Ticker")

          os.makedirs("data/stocks", exist_ok=True)
          man, fail = {}, []
          B = 40
          for i in range(0, len(tick), B):
              blk = tick[i:i+B]
              try:
                  df = yf.download(blk, start="2004-01-01", interval="1d",
                                   auto_adjust=True, progress=False,
                                   group_by="ticker", threads=True)
              except Exception as e:
                  print("Block-Fehler", i, e); fail += blk; continue

              for t in blk:
                  try:
                      d = df[t] if isinstance(df.columns, pd.MultiIndex) else df
                      d = d.dropna(subset=["Close"])
                      if len(d) < 250:
                          fail.append(t); continue
                      ix = d.index.tz_localize(None) if d.index.tz else d.index
                      o = pd.DataFrame({"date": ix,
                                        "open": d["Open"].values,
                                        "high": d["High"].values,
                                        "low": d["Low"].values,
                                        "close": d["Close"].values,
                                        "volume": d["Volume"].values})
                      o.to_csv(f"data/stocks/{t}.csv", index=False)
                      man[t] = {"n": len(o), "von": str(o.date.iloc[0].date()),
                                "bis": str(o.date.iloc[-1].date())}
                  except Exception:
                      fail.append(t)
              print(f"Block {i//B+1}: {len(man)} gesamt")
              time.sleep(2)

          json.dump({"aktien": man, "fehlend": fail},
                    open("data/STOCKS_MANIFEST.json", "w"), indent=2)
          print("fertig:", len(man), "geladen,", len(fail), "fehlend")
          PY

      - name: Committen
        run: |
          git config user.name datafeed-bot
          git config user.email actions@github.com
          git add data/
          git diff --staged --quiet || git commit -m "Aktien $(date -u +%F)"
          git pull --rebase --autostash
          git push
