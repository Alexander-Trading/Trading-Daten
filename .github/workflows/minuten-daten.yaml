name: Minuten-Daten laden
on:
  workflow_dispatch:
    inputs:
      auftraege:
        description: "instrument:zeitraeume, Leerzeichen-getrennt"
        default: "eurusd:m15,m5 usdjpy:m15,m5 deuidxeur:m15 usa500idxusd:m15"
      von_jahr:
        default: "2012"
      bis_jahr:
        default: "2026"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          items = []
          v, b = int("${{ inputs.von_jahr }}"), int("${{ inputs.bis_jahr }}")
          for a in "${{ inputs.auftraege }}".split():
              i, t = a.split(":")
              for y in range(v, b + 1, 4):
                  items.append({"inst": i, "tfs": t, "y0": y, "y1": min(y + 3, b)})
          print("matrix=" + json.dumps({"include": items}))
          PY

  laden:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas
      - name: Skript bereitstellen
        run: |
          if [ ! -f tools/lade_minuten.py ]; then echo "tools/lade_minuten.py fehlt im Repo"; exit 1; fi
      - name: Schnelltest (1 Tag)
        run: |
          python3 - <<'PY'
          import sys; sys.path.insert(0, "tools")
          import lade_minuten as L, pandas as pd, datetime as dt
          inst = "${{ matrix.inst }}".upper()
          for s in ("BID", "ASK"):
              d, s, df = L.tag(inst, dt.date(2024, 3, 5), s, L.FAKTOR[inst])
              if isinstance(df, str) or df is None:
                  sys.exit(f"Schnelltest {inst} {s} fehlgeschlagen: {df}")
              print(inst, s, len(df)); print(df.head(3)); print(df.tail(2))
          PY
      - name: Download und Aggregation
        env:
          DEADLINE_MIN: "300"
        run: python3 tools/lade_minuten.py "${{ matrix.inst }}" "${{ matrix.y0 }}" "${{ matrix.y1 }}" "${{ matrix.tfs }}" data/min
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: min-${{ matrix.inst }}-${{ matrix.y0 }}
          path: data/min/
          if-no-files-found: warn
